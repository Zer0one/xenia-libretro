name: Publish rolling core release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing four-component tag to build and publish'
        required: true
        type: string
      allow_android_failure:
        description: 'Permit this release to omit Android if either Android target fails'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rolling-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  WORKFLOW_COMMIT: ${{ github.sha }}

jobs:
  build:
    name: Build All Six Targets
    uses: ./.github/workflows/libretro.yml
    with:
      platforms: all
      allow_android_failure: ${{ inputs.allow_android_failure || false }}
      source_ref: ${{ inputs.release_tag || github.ref }}
      workflow_ref: ${{ github.sha }}
      release_tag: ${{ inputs.release_tag || github.ref_name }}

  publish:
    name: Verify And Publish Release
    needs: build
    # An explicitly permitted Android failure must not prevent desktop checks.
    # The verifier still requires every desktop package and matching Windows PDB.
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test Publication Gates
        run: python3 .ci/test_package_release.py
      - uses: actions/download-artifact@v4
        with:
          pattern: rolling-release-*
          path: dist
          merge-multiple: true
      - name: Verify Complete Platform Set And Tagged Source
        shell: bash
        env:
          ALLOW_ANDROID_FAILURE: ${{ inputs.allow_android_failure || false }}
        run: |
          python3 .ci/package-release.py verify --tag "$RELEASE_TAG" --output dist \
            --source-commit "$(git rev-parse "$RELEASE_TAG^{commit}")" \
            --publication-status "$RUNNER_TEMP/publication-status.json" --assemble-checksums
      - name: Publish CI Artifacts And Release Notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="release-notes/${RELEASE_TAG#v}.md"
          test -f "$notes"
          cp "$notes" "$RUNNER_TEMP/release-notes.md"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          status = json.loads((Path(os.environ['RUNNER_TEMP']) / 'publication-status.json').read_text())
          with (Path(os.environ['RUNNER_TEMP']) / 'release-notes.md').open('a') as stream:
              stream.write('\n### Published CI Targets\n\n' + ', '.join(status['published_targets']) + '.\n')
              if status['android_omitted']:
                  stream.write('\nAndroid was omitted from this release after a failed or incomplete Android build, under explicit user authorization. Desktop targets and Windows symbols passed their checks.\n')
          PY
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest \
              --title "Xenia Edge Libretro ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --latest \
              --title "Xenia Edge Libretro ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
